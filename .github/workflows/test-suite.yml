name: Test Suite
on:
  push:
    branches: [main, dev, 'feature/*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py makemigrations --check --dry-run --settings=mock_trading.test_settings
      - run: python backend/manage.py test accounts market --settings=mock_trading.test_settings
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --runInBand
        env:
          CI: 'true'
      - run: npm run build
        env:
          CI: 'false'
  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: revival_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: revival_isolated
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py test market.test_postgresql_concurrency --settings=mock_trading.revival_postgres_test_settings
        env:
          REVIVAL_TEST_PG_USER: revival_test
          REVIVAL_TEST_PG_PASSWORD: disposable_test_password
          REVIVAL_TEST_PG_PORT: '55432'
